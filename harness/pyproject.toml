[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmonitor"
version = "0.2.0rc1"
description = "Auditable ECMonitor retrieval, acquisition, extraction, validation, and workflow harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.22",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
fulltext-pdf = [
  "PyMuPDF>=1.24",
  "pypdf>=5.0",
]
fulltext-chem = [
  "rdkit>=2025.3",
]
fulltext-layout = [
  "pymupdf4llm>=0.0.17,<1",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-jsonschema>=4.23",
  "types-psutil>=7.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
ecmonitor-retrieval = "ecmonitor.retrieval_specialist.cli:main"
ecmonitor-download = "ecmonitor.download_specialist.cli:main"
ecmonitor-fulltext = "ecmonitor.fulltext_extraction.cli:main"
ecmonitor-workflow = "ecmonitor.orchestration.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecmonitor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.tmp_pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# The migrated engineering snapshot contains intentionally dense scientific literals and prompts.
# Keep correctness/style linting strict while delegating line wrapping to future focused refactors.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ecmonitor"]
