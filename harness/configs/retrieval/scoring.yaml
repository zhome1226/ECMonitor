scoring_version: "0.1.0"
evaluation_objective: "high_recall_screenable_retrieval"
positive_weights:
  novel_precision_at_20: 0.15
  normalized_novel_eligible_yield: 0.35
  novelty_rate: 0.10
  cross_source_breadth: 0.15
  scope_diversity: 0.15
  metadata_completeness: 0.05
  cumulative_eligible_yield: 0.05
penalty_weights:
  defer_rate: 0.12
  excluded_matrix_rate: 0.12
  laboratory_study_rate: 0.12
  no_concentration_rate: 0.12
  known_ineligible_overlap_rate: 0.10
  query_complexity: 0.02
acceptance:
  minimum_score_delta: 0.02
  objective: high_recall
  maximum_precision_drop: 0.20
  maximum_defer_rate_increase: 0.15
  excluded_matrix_rate_must_not_increase: false
  maximum_excluded_matrix_rate_increase: 0.20
  reject_improvement_from_source_failure: true
  expansion_requires_gain_include: true
  expansion_rejects_known_include_loss: true
  noise_reduction_rejects_any_include_loss: true
